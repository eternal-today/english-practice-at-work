<!DOCTYPE html>

<title>Stealth AL</title>
<!--
  Stealth AL — 프론트엔드 (GitHub Pages 정적 호스팅용)
  배포 전: 아래 <script> 안 GAS_URL 에 본인 GAS 웹앱 URL 입력
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #fafafa; color: #1a1a1a; min-height: 100vh; padding: 40px 20px; line-height: 1.6;
  }
  .container { max-width: 720px; margin: 0 auto; }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 28px; padding-bottom: 14px; border-bottom: 1px solid #e5e5e5;
  }
  .title { font-size: 13px; font-weight: 600; color: #666; letter-spacing: 1px; cursor: pointer; }
  .progress { font-size: 13px; color: #888; }

  .start-panel { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 32px; }
  .start-panel h2 { font-size: 16px; font-weight: 600; margin-bottom: 24px; color: #333; }
  .option-group { margin-bottom: 20px; }
  .option-label { font-size: 12px; color: #999; margin-bottom: 8px; display: block; }
  .option-row { display: flex; gap: 8px; }
  .opt-btn {
    padding: 8px 18px; background: #fff; border: 1px solid #d4d4d4; border-radius: 4px;
    font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .opt-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  select.opt-select {
    padding: 8px 12px; border: 1px solid #d4d4d4; border-radius: 4px;
    font-size: 14px; font-family: inherit; background: #fff;
  }
  .nav-row { display: flex; gap: 8px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #eee; }

  .mode-badge {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
    color: #888; background: #f0f0f0; padding: 3px 10px; border-radius: 3px; margin-bottom: 12px;
  }
  .korean {
    font-size: 18px; font-weight: 500; padding: 22px; background: #fff;
    border: 1px solid #e5e5e5; border-radius: 6px; margin-bottom: 20px;
  }
  .typing-input {
    width: 100%; padding: 14px 16px; font-size: 16px; font-family: inherit;
    border: 1px solid #d4d4d4; border-radius: 6px; margin-bottom: 12px; outline: none;
  }
  .typing-input:focus { border-color: #1a1a1a; }

  .hint-line { font-size: 13px; color: #999; margin-bottom: 16px; min-height: 20px; }
  .hint-line .hint-chunk {
    display: inline-block; background: #f0f0f0; padding: 2px 8px; border-radius: 3px;
    margin-right: 6px; color: #555;
  }

  .assembled {
    min-height: 70px; padding: 14px; background: #fff; border: 1px solid #e5e5e5;
    border-radius: 6px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
  }
  .assembled:empty::before { content: '여기에 청크가 조립됩니다'; color: #bbb; font-size: 13px; }
  .chunks-pool {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding: 14px;
    background: #f5f5f5; border-radius: 6px;

  /* 색 대비 반전: 조립 영역이 진하게(무게중심), 풀은 연하게 */
  .chunk {
    padding: 9px 14px; background: #f2f2f2; border: 1px solid #dcdcdc; border-radius: 4px;

  .chunk.wrong-pos { background: #fbeaea; border-color: #dd9999; color: #a33; }
  .chunk-key { font-size: 11px; color: #999; margin-right: 6px; font-weight: 600; }

  .answer-strip {

  button.action:hover { background: #333; }
  button.action.secondary { background: #fff; color: #1a1a1a; border: 1px solid #d4d4d4; }
  button.action.secondary:hover { background: #f5f5f5; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  button.mini {
    padding: 5px 12px; font-size: 12px; background: #fff; color: #444;

  button.mini:hover { border-color: #888; }

  .grade { border-radius: 6px; margin-bottom: 12px; overflow: hidden; border: 1px solid #e5e5e5; }
  .grade-head { padding: 10px 16px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .grade.pass .grade-head { background: #f0f7f0; color: #2a5a2a; }
  .grade.partial .grade-head { background: #fdf6ec; color: #8a5a1a; }
  .grade.retry .grade-head { background: #faf0f0; color: #7a2a2a; }
  .verdict-tag { font-size: 11px; padding: 2px 8px; border-radius: 3px; background: rgba(0,0,0,0.06); }
  .grade-body { padding: 14px 16px; background: #fff; }
  .grade-row { margin-bottom: 12px; }
  .grade-row:last-child { margin-bottom: 0; }
  .grade-row .label { font-size: 11px; color: #999; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 3px; }
  .grade-row .text { font-size: 15px; color: #1a1a1a; }
  .grade-row.minor .text { color: #8a5a1a; }
  .grade-row.native .text { color: #1a5a3a; font-weight: 500; }
  .grade-comment { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0; font-size: 13px; color: #777; }

  .feedback { padding: 14px 18px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
  .feedback.correct { background: #f0f7f0; border: 1px solid #c8e0c8; color: #2a5a2a; }
  .feedback.incorrect { background: #faf0f0; border: 1px solid #e0c8c8; color: #7a2a2a; }
  .feedback .answer { margin-top: 6px; font-weight: 500; color: #1a1a1a; font-size: 15px; }

  .pattern-note {
    padding: 12px 18px; background: #f7f7f2; border: 1px solid #e0e0d0; border-radius: 6px;
    margin-bottom: 12px; font-size: 13px; color: #55552a;
  }

  .collect-box {
    margin-top: 8px; padding: 14px 16px; background: #f7f9fb; border: 1px solid #d8e2ea;
    border-radius: 6px; margin-bottom: 12px;
  }
  .collect-box .cb-label { font-size: 11px; color: #6a8090; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; }
  .collect-box input {
    width: 100%; padding: 9px 12px; font-size: 14px; font-family: inherit;
    border: 1px solid #cdd8e0; border-radius: 4px; margin-bottom: 8px; outline: none;
  }
  .collect-box input:focus { border-color: #6a8090; }
  .collect-box .cb-row { display: flex; gap: 8px; align-items: center; }
  .type-select { padding: 8px 10px; border: 1px solid #cdd8e0; border-radius: 4px; font-size: 13px; font-family: inherit; background: #fff; }
  .collect-done { font-size: 13px; color: #2a5a2a; padding: 8px 0; }

  .coll-item {
    padding: 14px 16px; background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; margin-bottom: 10px;
  }
  .coll-term { font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .coll-type { font-size: 10px; color: #999; background: #f0f0f0; padding: 2px 7px; border-radius: 3px; margin-left: 8px; }
  .coll-meaning { font-size: 14px; color: #444; margin-top: 5px; }
  .coll-ai { font-size: 12px; color: #999; margin-top: 3px; }
  .coll-usage { font-size: 12px; color: #7a7a5a; margin-top: 5px; font-style: italic; }

  .quiz-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 28px; text-align: center; }
  .quiz-q { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
  .quiz-sub { font-size: 12px; color: #999; margin-bottom: 20px; }

  .summary-panel { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 32px; text-align: center; }
  .summary-panel h2 { font-size: 15px; font-weight: 600; color: #666; margin-bottom: 24px; }
  .big-number { font-size: 42px; font-weight: 700; margin-bottom: 6px; }
  .sub-metric { font-size: 13px; color: #888; margin-bottom: 28px; }

  .hint-bar { font-size: 12px; color: #999; text-align: center; margin-top: 16px; }
  .lookup-input {
    width: 130px; padding: 5px 10px; font-size: 12px; font-family: inherit;
    border: 1px solid #e0e0e0; border-radius: 4px; background: #fff; color: #444; outline: none;
    transition: width 0.15s ease;
  }
  .lookup-input:focus { border-color: #999; width: 180px; }
  .lookup-input::placeholder { color: #bbb; }
  .lookup-result-box {
    background: #fff; border: 1px solid #e5e5e5; border-radius: 6px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 14px;
  }
  .lookup-result-box .lr-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
  }
  .lookup-result-box .lr-term { font-weight: 600; color: #1a1a1a; }
  .lookup-result-box .lr-src {
    font-size: 10px; padding: 2px 7px; border-radius: 3px; letter-spacing: 0.3px;
  }
  .lookup-result-box .lr-src.coll { background: #eaf2f8; color: #3a6a8a; }
  .lookup-result-box .lr-src.llm { background: #f0f0f0; color: #888; }
  .lookup-result-box .lr-meaning { color: #333; }
  .lookup-result-box .lr-mine { font-size: 11px; color: #6a8090; margin-left: 6px; }
  .lookup-result-box .lr-usage { font-size: 12px; color: #7a7a5a; font-style: italic; margin-top: 3px; }
  .lookup-result-box .lr-item { padding: 5px 0; border-top: 1px solid #f2f2f2; }
  .lookup-result-box .lr-item:first-of-type { border-top: none; }
  .lookup-result-box .lr-close { cursor: pointer; color: #bbb; font-size: 12px; border: none; background: none; }
  .loading { text-align: center; padding: 40px; color: #888; }
  .spinner-text { color: #999; font-size: 13px; }
  .empty-note { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title" onclick="goHome()">STEALTH AL</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <input type="text" id="lookupInput" class="lookup-input" placeholder="단어 뜻 찾기" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();doLookup();}">
        <div class="progress" id="progress"></div>
      </div>
    </div>
    <div id="lookup-result"></div>
    <div id="app"><div class="loading">불러오는 중...</div></div>
    <div class="hint-bar" id="hintbar"></div>
  </div>

<script>
// ===== 설정 =====
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwm3Htan4X_r_zVgyGgnuxKhp6OdOKJGwvpOfJLBM3t08R4x1H0o67z57FysVW7BiWN/exec'; // ← 본인 GAS 웹앱 URL 입력
const KEY_MAP = '0123456789abcdef';

// ===== 상태 =====
let allSentences = [];
let session = [], sIdx = 0, mode = '';
let chunks = [], assembledOrder = [];
let hintCount = 0, attemptCount = 0, isAnswered = false;
let sessionResults = [];
let selCount = 5, selTag = 'All';
let quizItems = [], qIdx = 0, quizScore = 0;

// ===== 초기화 (안 푼 문장 10개 미만일 때만 5개 보충) =====
async function init() {
  try {
    const res = await fetch(`${GAS_URL}?action=getSentences`);
    const data = await res.json();
    allSentences = data.sentences;
    renderStart();

    const unseenCount = allSentences.filter(s => s.stats.attempts === 0).length;
    if (unseenCount < 10) {
      fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'generateSentences', count: 5 }) })
        .catch(err => console.error('생성 실패:', err));
    }
  } catch (err) {
    document.getElementById('app').innerHTML =
      `<div class="feedback incorrect">데이터를 불러오지 못했습니다: ${err.message}</div>`;
  }
}
function goHome() { renderStart(); }

// ===== 시작 화면 =====
function renderStart() {
  document.getElementById('progress').textContent = '';
  document.getElementById('hintbar').textContent = '';
  const tags = ['All', ...new Set(allSentences.flatMap(s => String(s.tags).split(',').map(t => t.trim())).filter(Boolean))];
  document.getElementById('app').innerHTML = `
    <div class="start-panel">
      <h2>오늘의 세션</h2>
      <div class="option-group">
        <span class="option-label">문제 수</span>
        <div class="option-row">
          <button class="opt-btn ${selCount===5?'active':''}" onclick="setCount(5)">5</button>
          <button class="opt-btn ${selCount===10?'active':''}" onclick="setCount(10)">10</button>
        </div>
      </div>
      <div class="option-group">
        <span class="option-label">태그</span>
        <select class="opt-select" id="tagSelect" onchange="selTag=this.value">
          ${tags.map(t => `<option value="${t}" ${t===selTag?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <button class="action" onclick="startSession()">세션 시작</button>
      <div class="nav-row">
        <button class="action secondary" onclick="openCollection()">수집함 보기</button>
        <button class="action secondary" onclick="startQuiz()">수집 퀴즈</button>
      </div>
      <div class="nav-row">
        <button class="action secondary" onclick="openDiagnoses()">학습 진단 기록</button>
      </div>
    </div>`;
}
function setCount(n) { selCount = n; renderStart(); }

// ===== 세션 구성 =====
// 세션 시작 시 최신 데이터를 다시 불러온다 (직전 세션 결과를 반영해 같은 문장 반복 방지)
// 틀린 문장(최우선) → 남은 자리를 복습 80% : 안 푼 20%로 배분 (타이핑 위주)
// 한쪽이 모자라면 다른 쪽으로 자동 보충해 자리를 낭비하지 않음
// 복습 우선순위: 덜 익은 것(typing 5회 미만) 먼저 → 익숙한 것은 후순위 강등, 각 그룹 내 오래 안 본 것 우선
async function startSession() {
  // 최신 데이터 재호출 (메모리 stats가 낡아 같은 문장이 반복되는 문제 방지)
  document.getElementById('app').innerHTML = `<div class="loading">세션 준비 중...</div>`;
  try {
    const res = await fetch(`${GAS_URL}?action=getSentences`);
    const data = await res.json();
    if (data.sentences) allSentences = data.sentences;
  } catch (err) {
    // 재호출 실패 시 기존 메모리 데이터로 진행 (세션이 아예 막히진 않게)
    console.error('세션 데이터 갱신 실패, 기존 데이터로 진행:', err);
  }

  // 오늘(YYYY-MM-DD)보다 mute_until이 크거나 같으면 아직 뮤트 중 → 세션에서 제외
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  let pool = allSentences.filter(s => s.chunks.length <= KEY_MAP.length);
  pool = pool.filter(s => {
    if (!s.mute_until) return true;
    const mu = String(s.mute_until).slice(0, 10); // 'YYYY-MM-DD' 또는 ISO 앞부분
    return mu < todayStr; // 오늘이 지났으면 포함, 아직이면 제외
  });
  if (selTag !== 'All') pool = pool.filter(s => String(s.tags).includes(selTag));
  const wrong = shuffle(pool.filter(s => s.stats.attempts > 0 && !s.stats.ever_correct));
  const unseen = shuffle(pool.filter(s => s.stats.attempts === 0));
  // 복습 정렬: (1) 아직 덜 익은 것(typing 5회 미만) 먼저 · 익숙해진 것(5회+)은 뒤로 강등
  //           (2) 같은 그룹 안에서는 오래 안 본 것 먼저(last_seen 오름차순)
  const GRADUATE_TYPING = 5; // typing으로 이만큼 나오면 익숙한 것으로 보고 후순위로
  const review = pool.filter(s => s.stats.attempts > 0 && s.stats.ever_correct)
    .sort((a, b) => {
      const ga = (a.stats.typing_count || 0) >= GRADUATE_TYPING ? 1 : 0;
      const gb = (b.stats.typing_count || 0) >= GRADUATE_TYPING ? 1 : 0;
      if (ga !== gb) return ga - gb; // 덜 익은 것(0)이 앞
      return String(a.stats.last_seen).localeCompare(String(b.stats.last_seen));
    });

  // 1) 틀린 문장 먼저 채움
  const picked = wrong.slice(0, selCount);
  let remaining = selCount - picked.length;

  // 2) 남은 자리를 복습 80% : 안 푼 20%로 배분 (타이핑 위주 학습)
  let reviewQuota = Math.ceil(remaining * 0.8);
  let unseenQuota = remaining - reviewQuota;

  // 3) 한쪽이 부족하면 다른 쪽으로 보충 (자리 낭비 방지)
  const reviewTake = Math.min(reviewQuota, review.length);
  const unseenTake = Math.min(unseenQuota, unseen.length);
  let shortfall = remaining - reviewTake - unseenTake;
  const reviewExtra = Math.min(shortfall, review.length - reviewTake);
  shortfall -= reviewExtra;
  const unseenExtra = Math.min(shortfall, unseen.length - unseenTake);

  const reviewPick = review.slice(0, reviewTake + reviewExtra);
  const unseenPick = unseen.slice(0, unseenTake + unseenExtra);

  // 4) 최종 배치: 틀린 것 → 복습 → 안 푼 것 (복습이 뒤로 밀려 잘리지 않도록)
  session = [...picked, ...reviewPick, ...unseenPick];

  if (session.length === 0) {
    document.getElementById('app').innerHTML =
      `<div class="feedback incorrect">해당 조건의 문장이 없습니다.</div>
       <button class="action secondary" onclick="renderStart()">돌아가기</button>`;
    return;
  }
  sIdx = 0; sessionResults = [];
  loadQuestion();
}

function loadQuestion() {
  if (sIdx >= session.length) { renderSummary(); return; }
  const s = session[sIdx];
  // 처음 보는 문장 → Scramble, 한 번이라도 시도 → Typing
  mode = s.stats.attempts === 0 ? 'scramble' : 'typing';
  attemptCount = 0; hintCount = getInitialHints(s); isAnswered = false; assembledOrder = [];
  if (mode === 'scramble') {
    chunks = shuffle([...s.chunks]).map((text, i) => ({ text, key: KEY_MAP[i], selected: false }));
  }
  document.getElementById('progress').textContent = `${sIdx + 1} / ${session.length}`;
  render();
}

// 숙련도 기반 기본 힌트 개수 (첫시도 성공 0회→2 / 1회→1 / 2회+→0)
function getInitialHints(s) {
  if (mode !== 'typing') return 0;
  const success = s.stats.first_try_success || 0;
  if (success === 0) return 2;
  if (success === 1) return 1;
  return 0;
}

// ===== 렌더링 =====
function render() {
  const s = session[sIdx];
  if (mode === 'typing') {
    document.getElementById('app').innerHTML = `
      <div class="mode-badge">TYPING · 자유 영작</div>
      <div class="korean">${s.korean_text}</div>
      <input type="text" class="typing-input" id="typingInput" placeholder="영어로 자유롭게 작문하세요" autocomplete="off" ${isAnswered ? 'disabled' : ''}>
      <div class="hint-line" id="hintLine"></div>
      <div class="controls">
        <button class="action" onclick="checkTyping()" id="submitBtn">채점 (Enter)</button>
        <button class="action secondary" onclick="revealHint()">힌트 (Tab)</button>
        <button class="action secondary" onclick="nextQuestion()">다음 (N)</button>
      </div>
      <div id="feedback-area"></div>
      <div id="pattern-area"></div>
      <div id="collect-area"></div>`;
    document.getElementById('hintbar').textContent = 'Tab: 청크 힌트 · Enter: 채점 · N: 다음';
    const input = document.getElementById('typingInput');
    input.focus();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); isAnswered ? nextQuestion() : checkTyping(); }
      if (e.key === 'Tab') { e.preventDefault(); revealHint(); }
    });
    renderHints();
  } else {
    const assembledHTML = assembledOrder.map(i => {
      const c = chunks[i];
      return `<button class="chunk in-assembled" onclick="toggleChunk(${i})"><span class="chunk-key">${c.key}</span>${c.text}</button>`;
    }).join('');
    const poolHTML = chunks.map((c, i) =>
      `<button class="chunk ${c.selected ? 'selected' : ''}" onclick="toggleChunk(${i})"><span class="chunk-key">${c.key}</span>${c.text}</button>`
    ).join('');
    document.getElementById('app').innerHTML = `
      <div class="mode-badge">FIRST LOOK · SCRAMBLE</div>
      <div class="korean">${s.korean_text}</div>
      <div class="assembled">${assembledHTML}</div>
      <div class="chunks-pool">${poolHTML}</div>
      <div class="controls">
        <button class="action" onclick="checkScramble()" ${assembledOrder.length === 0 ? 'disabled' : ''}>확인 (Enter)</button>
        <button class="action secondary" onclick="clearAssembled()">클리어 (Esc)</button>
        <button class="action secondary" onclick="nextQuestion()">다음 (N)</button>
      </div>
      <div id="feedback-area"></div>
      <div id="pattern-area"></div>
      <div id="collect-area"></div>`;
    document.getElementById('hintbar').textContent = '0~9, a~f: 청크 토글 · Esc: 클리어 · Enter: 확인 · N: 다음';
  }
}

function renderHints() {
  const s = session[sIdx];
  const el = document.getElementById('hintLine');
  if (!el) return;
  const shown = s.chunks.slice(0, hintCount).map(c => `<span class="hint-chunk">${c}</span>`).join('');
  const more = hintCount < s.chunks.length
    ? `<span style="color:#bbb; font-size:12px;">Tab: 힌트 더 보기 (${hintCount}/${s.chunks.length})</span>`
    : `<span style="color:#bbb; font-size:12px;">전체 힌트 표시됨</span>`;
  el.innerHTML = shown + (shown ? ' ' : '') + more;
}
function revealHint() {
  if (isAnswered) return;
  const s = session[sIdx];
  if (hintCount < s.chunks.length) { hintCount++; renderHints(); }
}

// ===== 타이핑 소극적 수정 diff =====
function normalizeForCompare(t) {
  return t.toLowerCase().replace(/[’]/g, "'").replace(/[.,!?"“”]/g, '').replace(/\s+/g, ' ').trim();
}
function renderMinorText(userInput, minor) {
  if (normalizeForCompare(userInput) === normalizeForCompare(minor)) return { same: true, html: '' };
  const uw = userInput.split(/\s+/), mw = minor.split(/\s+/);
  const marked = mw.map((w, i) =>
    (normalizeForCompare(uw[i] || '') !== normalizeForCompare(w))
      ? `<span style="color:#c0392b; font-weight:600; text-decoration:underline;">${w}</span>` : w
  ).join(' ');
  return { same: false, html: marked };
}

// ===== 타이핑 채점 =====
async function checkTyping() {
  if (isAnswered) return;
  const input = document.getElementById('typingInput');
  const userText = input.value.trim();
  if (!userText) return;
  attemptCount++;
  const s = session[sIdx];
  const allHintsOpen = hintCount >= s.chunks.length;
  const fb = document.getElementById('feedback-area');
  document.getElementById('submitBtn').disabled = true;
  fb.innerHTML = `<div class="spinner-text">AI가 채점 중입니다...</div>`;
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'gradeTyping', korean_text: s.korean_text, reference_answer: s.english_text, user_input: userText })
    });
    const g = await res.json();
    const verdict = g.verdict || 'partial';
    const isPass = verdict === 'pass';
    logAttempt(s.id, isPass, attemptCount, userText, 'typing');
    // 첫 제출 + 힌트 전체 미사용일 때만 지표 집계
    if (attemptCount === 1 && !allHintsOpen) sessionResults.push({ counted: true, first_pass: isPass });
    else if (attemptCount === 1 && allHintsOpen) sessionResults.push({ counted: false, first_pass: false });
    renderGrade(g, s, userText);
    if (isPass) {
      isAnswered = true;
      document.getElementById('typingInput').disabled = true;
      fetchPatternNote(s.id);
      renderCollectButton(s, true);
    } else {
      document.getElementById('submitBtn').disabled = false;
    }
  } catch (err) {
    fb.innerHTML = `<div class="feedback incorrect">채점 오류: ${err.message}</div>`;
    document.getElementById('submitBtn').disabled = false;
  }
}

function renderGrade(g, s, userText) {
  const verdict = g.verdict || 'partial';
  const labelMap = { pass: '통과', partial: '부분 통과', retry: '다시 시도' };
  const fb = document.getElementById('feedback-area');
  const minorResult = g.minor ? renderMinorText(userText, g.minor) : null;
  let minorRow = '';
  if (minorResult) {
    if (minorResult.same) {
      minorRow = `<div class="grade-row"><div class="label">소극적 수정 · 문법만</div>
        <div class="text" style="color:#2a5a2a;">문법 오류 없음 · 작성하신 문장을 그대로 쓰셔도 좋습니다</div></div>`;
    } else {
      minorRow = `<div class="grade-row minor"><div class="label">소극적 수정 · 문법만 (밑줄이 고친 부분)</div>
        <div class="text">${minorResult.html}</div></div>`;
    }
  }

  // 따라 쓰기(가리고 재현)용 문장 저장 · retry가 아닐 때만 진입 버튼 노출
  // minor: 내 문법 교정본 / model: 원문(모범답)
  _shadowTexts = {
    minor: (verdict !== 'retry' && g.minor) ? g.minor : '',
    model: (verdict !== 'retry' && s.english_text) ? s.english_text : ''
  };
  let shadowEntry = '';
  if (_shadowTexts.minor || _shadowTexts.model) {
    const btns = [];
    if (_shadowTexts.minor) btns.push(`<button class="mini" onclick="startShadow('minor')">소극적 따라 쓰기</button>`);
    if (_shadowTexts.model) btns.push(`<button class="mini" onclick="startShadow('model')">모범답 따라 쓰기</button>`);
    shadowEntry = `
      <div class="grade-comment" style="border-top:1px solid #f0f0f0;">
        <div style="font-size:11px; color:#999; font-weight:600; letter-spacing:0.5px; margin-bottom:6px;">따라 쓰기 · 안 보고 재현 연습 (기록 안 됨)</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">${btns.join('')}</div>
        <div id="shadow-area" style="margin-top:10px;"></div>
      </div>`;
  }

  fb.innerHTML = `
    <div class="grade ${verdict}">
      <div class="grade-head"><span class="verdict-tag">${labelMap[verdict]}</span>${verdict === 'retry' ? '의미를 다시 확인해보세요' : ''}</div>
      <div class="grade-body">
        ${minorRow}
        ${(verdict !== 'retry' && s.english_text) ? `<div class="grade-row native"><div class="label">모범답 · 원문 AL</div><div class="text">${escapeHtml(s.english_text)}</div></div>` : ''}
        ${g.comment ? `<div class="grade-comment">${g.comment}</div>` : ''}
        ${shadowEntry}
      </div>
    </div>`;
}

// ===== 따라 쓰기 (가리고 재현) · LLM/서버 호출 없음, 통계 미반영 =====
let _shadowTexts = { minor: '', model: '' };
function shadowLabel(kind) { return kind === 'minor' ? '소극적 · 문법만' : '모범답 · 원문 AL'; }
function startShadow(kind) {

  const kr = (session[sIdx] && session[sIdx].korean_text) ? session[sIdx].korean_text : '';
  const krLine = kr
    ? `<div style="font-size:14px; color:#555; padding:6px 10px; background:#fff; border:1px solid #e5e5e5; border-radius:4px; margin-bottom:8px;">${escapeHtml(kr)}</div>`

  area.innerHTML = `
    <div class="collect-box" style="background:#f7f9fb; border-color:#d8e2ea;">
      <div class="cb-label">${label} · 한국어를 보고 기억으로 재현해 보세요</div>

function checkShadow(kind) {
  const input = document.getElementById('shadowInput');
  const target = _shadowTexts[kind];
  const typed = input.value.trim();
  if (!typed) return;
  const result = document.getElementById('shadow-result');

  } else {

        <div class="answer" style="font-weight:400;">${cmp.html}</div>
        <div style="margin-top:8px;"><button class="mini" onclick="startShadow('${kind}')">다시 도전</button></div>
      </div>`;

}

// ===== Scramble =====
function toggleChunk(idx) {
  if (isAnswered || mode !== 'scramble') return;
  const c = chunks[idx];
  if (c.selected) { c.selected = false; assembledOrder = assembledOrder.filter(i => i !== idx); }
  else { c.selected = true; assembledOrder.push(idx); }
  render();
}
function clearAssembled() {
  if (isAnswered) return;
  chunks.forEach(c => c.selected = false); assembledOrder = []; render();
}
// LCS 기반 위치 정오 판정 (한 칸 밀림에 강함)
function markScrambleCorrectness(userArr, answerArr) {
  const n = userArr.length, m = answerArr.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    dp[i][j] = (userArr[i-1] === answerArr[j-1]) ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const correct = new Array(n).fill(false);
  let i = n, j = m;
  while (i > 0 && j > 0) {
    if (userArr[i-1] === answerArr[j-1]) { correct[i-1] = true; i--; j--; }
    else if (dp[i-1][j] >= dp[i][j-1]) i--; else j--;
  }
  return correct;
}
function renderAnswerStrip(answerArr) {
  return `<div class="strip-label">정답 배열</div><div class="answer-strip">${answerArr.map(t => `<span class="chunk-mini">${t}</span>`).join('')}</div>`;
}
function showAnswerStrip() {
  const s = session[sIdx];
  const area = document.getElementById('answer-strip-area');
  if (area) area.innerHTML = renderAnswerStrip(s.chunks);
}
function checkScramble() {
  if (assembledOrder.length === 0 || isAnswered) return;
  attemptCount++;
  const s = session[sIdx];
  const userArr = assembledOrder.map(i => chunks[i].text);
  const answerArr = s.chunks;
  const userText = userArr.join(' ');
  const isCorrect = userText === answerArr.join(' ');
  logAttempt(s.id, isCorrect, attemptCount, userText, 'scramble');
  const fb = document.getElementById('feedback-area');
  if (isCorrect) {
    isAnswered = true;
    if (attemptCount === 1) sessionResults.push({ counted: true, first_pass: true });
    else if (sessionResults.length < sIdx + 1) sessionResults.push({ counted: true, first_pass: false });
    fb.innerHTML = `<div class="feedback correct">정답입니다 (${attemptCount}번째 시도)<div class="answer">${s.english_text}</div></div>`;
    fetchPatternNote(s.id);
    renderCollectButton(s);
    return;
  }
  const correctFlags = markScrambleCorrectness(userArr, answerArr);
  document.querySelectorAll('.assembled .chunk').forEach((el, idx) => {
    el.classList.remove('in-assembled');
    el.classList.add(correctFlags[idx] ? 'correct-pos' : 'wrong-pos');
  });
  fb.innerHTML = `
    <div class="feedback incorrect">
      <div>초록은 자리가 맞는 청크, 빨강은 위치가 어긋난 청크예요. 빨강만 옮겨보세요.</div>
      <div style="margin-top:10px;"><button class="action secondary" onclick="showAnswerStrip()">정답 배열 보기</button></div>
      <div id="answer-strip-area" style="margin-top:12px;"></div>
      <div id="scramble-hint" class="spinner-text" style="margin-top:10px;">AI 힌트 준비 중...</div>
    </div>`;
  requestScrambleHint(s, userText);
}
async function requestScrambleHint(s, userText) {
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'analyzeError', korean_text: s.korean_text, correct_answer: s.english_text, user_input: userText, attempt_number: attemptCount })
    });
    const data = await res.json();
    const el = document.getElementById('scramble-hint');
    if (el && !isAnswered) { el.classList.remove('spinner-text'); el.style.color = '#7a2a2a'; el.textContent = data.hint || ''; }
  } catch (err) { console.error('힌트 오류:', err); }
}

// ===== 수집 UI =====
function renderCollectButton(s, showMute) {
  const area = document.getElementById('collect-area');
  if (!area) return;
  const muteBtn = showMute
    ? `<button class="mini" onclick="muteSentence('${s.id}')" id="muteBtn-${s.id}" style="margin-left:8px;">이미 익숙함 · 5일간 안 보기</button>`
    : '';
  area.innerHTML = `<button class="mini" onclick="openCollectBox('${s.id}')">+ 표현 수집</button>${muteBtn}<span id="mute-status" class="spinner-text" style="margin-left:8px;"></span>`;
}
async function muteSentence(sentenceId) {
  const btn = document.getElementById(`muteBtn-${sentenceId}`);
  const status = document.getElementById('mute-status');
  if (btn) btn.disabled = true;
  if (status) status.textContent = '처리 중...';
  try {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'muteSentence', sentence_id: sentenceId }) });
    const data = await res.json();
    if (data.success) {
      if (btn) btn.textContent = `${data.mute_until}까지 숨김`;
      if (status) status.textContent = '';
    } else {
      if (status) status.textContent = '실패: ' + (data.error || '');
      if (btn) btn.disabled = false;
    }
  } catch (err) {
    if (status) status.textContent = '오류: ' + err.message;
    if (btn) btn.disabled = false;
  }
}
function openCollectBox(sentenceId) {
  const area = document.getElementById('collect-area');

    <div class="collect-box">
      <div class="cb-label">수집할 단어 · 표현</div>

        action: 'saveCollection', type, term, meaning_mine: mine,

        </div>`;

      area.innerHTML = `

        <div id="meaning-edit-slot" style="margin-top:8px;">
          <button class="mini" onclick="openMeaningEditor('meaning-edit-slot', '${escapeAttr(data.id)}', '${escapeAttr(data.meaning_ai || '')}', '${escapeAttr(mine || '')}', true)">뜻 수정</button>

    btn.disabled = false;

}

// ===== 뜻 수정 (수집함 목록 + 저장 직후 경고, 공용) =====
// slotId: 편집 UI를 그릴 컨테이너 id
// aiMeaning: 기본값으로 채울 AI 기준 뜻
// currentMine: 현재 내 뜻 (있으면 우선 표시)
// inline: true면 저장 후 완료 문구만, false면 목록의 '내 뜻' 줄도 갱신
function openMeaningEditor(slotId, id, aiMeaning, currentMine, inline) {
  const slot = document.getElementById(slotId);
  if (!slot) return;
  const initial = currentMine || aiMeaning; // 기본은 AI 뜻 채움, 이미 내 뜻 있으면 그걸 우선
  slot.innerHTML = `
    <div class="collect-box">
      <div class="cb-label">뜻 수정 · 내 뜻으로 저장</div>

      <div class="cb-row">
        <button class="mini" onclick="fillAiMeaning('${escapeAttr(id)}', '${escapeAttr(aiMeaning)}')">AI 뜻 채우기</button>
        <button class="action" onclick="saveMeaningEdit('${slotId}', '${escapeAttr(id)}', ${inline})" id="edit-save-${escapeAttr(id)}">저장</button>
        <button class="mini" onclick="cancelMeaningEdit('${slotId}', '${escapeAttr(id)}', '${escapeAttr(aiMeaning)}', '${escapeAttr(currentMine)}', ${inline})">취소</button>

}
function fillAiMeaning(id, aiMeaning) {

  if (input) { input.value = aiMeaning; input.focus(); }
}
function cancelMeaningEdit(slotId, id, aiMeaning, currentMine, inline) {
  const slot = document.getElementById(slotId);
  if (slot) slot.innerHTML = `<button class="mini" onclick="openMeaningEditor('${slotId}', '${escapeAttr(id)}', '${escapeAttr(aiMeaning)}', '${escapeAttr(currentMine)}', ${inline})">뜻 수정</button>`;
}
async function saveMeaningEdit(slotId, id, inline) {
  const input = document.getElementById(`edit-input-${id}`);
  const newMine = input.value.trim();
  const saveBtn = document.getElementById(`edit-save-${id}`);
  const status = document.getElementById(`edit-status-${id}`);
  saveBtn.disabled = true;
  status.textContent = '저장 중...';
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'updateCollectionMeaning', id, meaning_mine: newMine })
    });
    const data = await res.json();
    const slot = document.getElementById(slotId);
    if (data.success) {
      // 목록 화면이면 해당 항목의 '내 뜻' 줄도 즉시 갱신
      const mineLine = document.getElementById(`mine-${id}`);
      if (mineLine) {
        mineLine.innerHTML = newMine ? '내 뜻 · ' + escapeHtml(newMine) : '<span style="color:#bbb;">내 뜻 · (없음)</span>';
      }
      if (slot) slot.innerHTML = `<div class="collect-done">수정 완료 · ${newMine ? escapeHtml(newMine) : '(내 뜻 비움)'}</div>`;
    } else {
      status.textContent = '저장 실패: ' + (data.error || '');
      saveBtn.disabled = false;
    }
  } catch (err) {
    status.textContent = '오류: ' + err.message;
    saveBtn.disabled = false;
  }
}

let _deleteArmed = {}; // id별 '삭제 준비됨' 상태
function confirmDelete(id) {
  const btn = document.getElementById(`del-${id}`);
  if (!btn) return;
  if (_deleteArmed[id]) { doDelete(id); return; }
  _deleteArmed[id] = true;
  btn.textContent = '정말 삭제?';
  btn.style.fontWeight = '600';
  // 3초 안에 재클릭 없으면 원상복구
  _deleteArmed['_t_' + id] = setTimeout(() => {
    _deleteArmed[id] = false;
    if (document.getElementById(`del-${id}`)) {
      btn.textContent = '삭제';
      btn.style.fontWeight = '';
    }
  }, 3000);
}
async function doDelete(id) {
  clearTimeout(_deleteArmed['_t_' + id]);
  _deleteArmed[id] = false;
  const btn = document.getElementById(`del-${id}`);
  const status = document.getElementById(`del-status-${id}`);
  if (btn) btn.disabled = true;
  if (status) status.textContent = '삭제 중...';
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'deleteCollection', id })
    });
    const data = await res.json();
    if (data.success) {
      const card = document.getElementById(`card-${id}`);
      if (card) card.remove();
    } else {
      if (status) status.textContent = '삭제 실패: ' + (data.error || '');
      if (btn) { btn.disabled = false; btn.textContent = '삭제'; btn.style.fontWeight = ''; }
    }
  } catch (err) {
    if (status) status.textContent = '오류: ' + err.message;
    if (btn) { btn.disabled = false; btn.textContent = '삭제'; btn.style.fontWeight = ''; }

// ===== 수집 퀴즈 (양방향 · 숙련도 배분) =====
// 정답률 60% 미만/미풀이 → 표현→뜻(재인, recog), 60% 이상 → 뜻→표현(인출, recall)
// B안: 재인 그룹을 앞(정답률 낮은 순), 인출 그룹을 뒤로 배치해 화면 방향이 튀지 않게 함
const RECOG_THRESHOLD = 0.6; // 이 미만이면 재인(표현→뜻)으로 출제
async function startQuiz() {
  document.getElementById('progress').textContent = '';
  document.getElementById('hintbar').textContent = '';
  document.getElementById('app').innerHTML = `<div class="loading">퀴즈 준비 중...</div>`;
  try {
    const res = await fetch(`${GAS_URL}?action=getCollection`);
    const data = await res.json();
    let items = (data.items || []).filter(it => it.meaning_mine || it.meaning_ai);
    if (items.length < 4) {
      document.getElementById('app').innerHTML = `
        <div class="empty-note">퀴즈를 만들려면 뜻이 있는 수집 표현이 4개 이상 필요합니다.<br>(현재 ${items.length}개)</div>
        <button class="action secondary" onclick="renderStart()">돌아가기</button>`;
      return;
    }
    // 각 항목에 정답률(_rate)과 출제 방향(_dir) 부여
    items.forEach(it => {
      const q = Number(it.quiz_count) || 0;
      it._rate = q ? (Number(it.correct_count) || 0) / q : 0; // 미풀이는 0 → 재인行
      it._dir = it._rate < RECOG_THRESHOLD ? 'recog' : 'recall';
    });
    // 재인(recog) 먼저 · 그 안에서 정답률 낮은 순 → 인출(recall) 뒤로
    items.sort((a, b) => {
      if (a._dir !== b._dir) return a._dir === 'recog' ? -1 : 1;
      return a._rate - b._rate;
    });
    quizItems = items.slice(0, Math.min(10, items.length));
    qIdx = 0; quizScore = 0;
    renderQuizQuestion();
  } catch (err) {
    document.getElementById('app').innerHTML = `<div class="feedback incorrect">퀴즈 로드 실패: ${err.message}</div>`;
  }
}
function meaningOf(it) { return it.meaning_mine || it.meaning_ai; }
function renderQuizQuestion() {
  if (qIdx >= quizItems.length) { renderQuizSummary(); return; }
  const cur = quizItems[qIdx];
  const isRecog = cur._dir === 'recog'; // true=표현→뜻, false=뜻→표현
  const distractors = shuffle(quizItems.filter(it => it.id !== cur.id)).slice(0, 3);
  const options = shuffle([cur, ...distractors]);
  const prompt = isRecog ? cur.term : meaningOf(cur);
  const subLabel = isRecog ? '이 표현의 뜻은?' : '이 뜻에 해당하는 표현은?';
  const optLabel = it => isRecog ? meaningOf(it) : it.term;
  document.getElementById('progress').textContent = `${qIdx + 1} / ${quizItems.length}`;
  document.getElementById('app').innerHTML = `
    <div class="quiz-card">
      <div class="quiz-sub">${subLabel}</div>
      <div class="quiz-q">${escapeHtml(prompt)}</div>
      <div class="controls" style="flex-direction:column; align-items:stretch;">
        ${options.map(it => `<button class="action secondary" style="margin-bottom:8px;" onclick="answerQuiz('${escapeAttr(it.id)}')">${escapeHtml(optLabel(it))}</button>`).join('')}
      </div>
      <div id="quiz-feedback"></div>
    </div>`;
}
async function answerQuiz(chosenId) {
  const cur = quizItems[qIdx];
  const isRecog = cur._dir === 'recog';
  const correct = chosenId === cur.id;
  if (correct) quizScore++;
  updateQuizStat(cur.id, correct);
  // 정답으로 보여줄 텍스트: 재인이면 뜻, 인출이면 표현
  const answerText = isRecog ? meaningOf(cur) : cur.term;
  const fb = document.getElementById('quiz-feedback');
  fb.innerHTML = correct
    ? `<div class="feedback correct">정답! <b>${escapeHtml(answerText)}</b></div><button class="action" onclick="nextQuiz()">다음</button>`
    : `<div class="feedback incorrect">정답은 <b>${escapeHtml(answerText)}</b> 입니다.
       ${cur.usage ? `<div style="margin-top:6px; font-size:13px; color:#777;">용례 · ${escapeHtml(cur.usage)}</div>` : ''}</div>
       <button class="action" onclick="nextQuiz()">다음</button>`;
  document.querySelectorAll('.quiz-card .action.secondary').forEach(b => b.disabled = true);
}
function nextQuiz() { qIdx++; renderQuizQuestion(); }
function renderQuizSummary() {
  const rate = quizItems.length ? Math.round(quizScore / quizItems.length * 100) : 0;
  document.getElementById('progress').textContent = '';
  document.getElementById('app').innerHTML = `
    <div class="summary-panel">
      <h2>퀴즈 완료</h2>
      <div class="big-number">${quizScore} / ${quizItems.length}</div>
      <div class="sub-metric">정답률 ${rate}%</div>
      <button class="action" onclick="startQuiz()">한 번 더</button>
      <button class="action secondary" onclick="renderStart()" style="margin-left:8px;">돌아가기</button>
    </div>`;
}
async function updateQuizStat(id, correct) {
  try {
    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'updateQuizStat', id, correct }) });
  } catch (err) { console.error('퀴즈 통계 실패:', err); }
}

// ===== 세션 요약 =====
// 작문 기준 추정 등급(로컬 계산) + 타이핑 20개 도달 시 자동 심층 진단(LLM)
function estimateLocalLevel() {
  // 근거: 누적 첫시도 통과율 + 다뤄본 문장 평균 복잡도(청크 수)
  let attempted = 0, first = 0, chunkSum = 0, chunkN = 0;
  allSentences.forEach(s => {
    if (s.stats.attempts > 0) {
      attempted++;
      if (s.stats.first_try_success > 0) first++;
      chunkSum += s.chunks.length; chunkN++;
    }
  });
  const passRate = attempted > 0 ? first / attempted : 0;
  const avgChunks = chunkN > 0 ? chunkSum / chunkN : 0;
  // 거친 구간 추정 (정확한 값 아님)
  let level = 'IM';
  if (passRate >= 0.8 && avgChunks >= 6) level = 'AL';
  else if (passRate >= 0.65) level = 'IH';
  else if (passRate >= 0.4) level = 'IM';
  else level = 'IL';
  return { level, passRate: Math.round(passRate * 100), avgChunks: avgChunks.toFixed(1), attempted };
}

function renderSummary() {
  const counted = sessionResults.filter(r => r.counted);
  const passed = counted.filter(r => r.first_pass).length;
  const rate = counted.length > 0 ? Math.round(passed / counted.length * 100) : 0;
  let cumAttempted = 0, cumFirst = 0;
  allSentences.forEach(s => { if (s.stats.attempts > 0) { cumAttempted++; if (s.stats.first_try_success > 0) cumFirst++; } });
  const cumRate = cumAttempted > 0 ? Math.round(cumFirst / cumAttempted * 100) : 0;
  const lv = estimateLocalLevel();
  document.getElementById('progress').textContent = '';
  document.getElementById('hintbar').textContent = '';
  document.getElementById('app').innerHTML = `
    <div class="summary-panel">
      <h2>세션 완료</h2>
      <div class="big-number">${rate}%</div>
      <div class="sub-metric">이번 세션 첫시도 통과율 (${passed}/${counted.length}, 힌트 전체 사용 제외) · 누적 ${cumRate}%</div>
      <div style="margin:18px 0; padding:14px 16px; background:#f7f7f2; border:1px solid #e0e0d0; border-radius:6px;">
        <div style="font-size:11px; color:#999; font-weight:600; letter-spacing:0.5px; margin-bottom:4px;">작문 기준 추정 등급</div>
        <div style="font-size:22px; font-weight:700; color:#55552a;">${lv.level} 근처</div>
        <div style="font-size:12px; color:#999; margin-top:4px;">누적 첫시도 통과율 ${lv.passRate}% · 평균 복잡도 ${lv.avgChunks}청크 · 실제 스피킹과 다를 수 있음</div>
      </div>
      <div id="diagnose-area" style="margin-bottom:16px;"></div>
      <button class="action" id="newSessionBtn" onclick="renderStart()">새 세션 시작</button>
    </div>`;
  runDiagnoseIfReady();
}

      const imps = (d.improvements || []).map(x => `<li style="margin-bottom:3px;">${escapeHtml(x)}</li>`).join('');
      area.innerHTML = `

        </div>`;
    } else if (data.until_next != null && data.until_next > 0) {
      area.innerHTML = `<div style="font-size:12px; color:#bbb;">다음 심층 진단까지 타이핑 ${data.until_next}개 남음</div>`;
    } else {
      area.innerHTML = '';
    }
  } catch (err) {
    area.innerHTML = `<div style="font-size:12px; color:#bbb;">진단 확인 실패 (건너뜀)</div>`;
  } finally {
    // 확인 완료 → 새 세션 버튼 복구
    if (btn) { btn.disabled = false; delete btn.dataset.locked; }
  }
}

// ===== 로그 =====
async function logAttempt(sentenceId, isCorrect, attemptNumber, userInput, mode) {
  try {
    await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'logAttempt', sentence_id: sentenceId, is_correct: isCorrect, attempt_number: attemptNumber, user_input: userInput, mode: mode || '' })
    });
  } catch (err) { console.error('로그 실패:', err); }
}

// ===== 키보드 (Scramble 전용) =====
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, select')) return;
  const key = e.key.toLowerCase();
  if (mode === 'scramble') {
    if (KEY_MAP.includes(key)) {
      const idx = KEY_MAP.indexOf(key);
      if (idx < chunks.length) { e.preventDefault(); toggleChunk(idx); }
      return;
    }
    if (e.key === 'Escape') { clearAssembled(); return; }
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (isAnswered) nextQuestion();
    else if (mode === 'scramble') checkScramble();
  } else if (key === 'n' && isAnswered) { nextQuestion(); }
});

// ===== 단어 뜻 찾기 (헤더 검색창) · 수집함 우선, 없으면 LLM =====
async function doLookup() {
  const input = document.getElementById('lookupInput');
  const term = input.value.trim();
  const box = document.getElementById('lookup-result');
  if (!term) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="lookup-result-box"><span class="spinner-text">"${escapeHtml(term)}" 찾는 중...</span></div>`;
  try {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'lookupWord', term }) });
    const data = await res.json();
    if (data.error) { box.innerHTML = `<div class="lookup-result-box">${escapeHtml(data.error)}</div>`; return; }

    let body = '';
    if (data.source === 'collection' && data.matches && data.matches.length) {
      body = data.matches.map(m => `
        <div class="lr-item">
          <div><span class="lr-term">${escapeHtml(m.term)}</span>${m.is_mine ? '<span class="lr-mine">내 뜻</span>' : '<span class="lr-mine">AI 뜻</span>'}</div>
          <div class="lr-meaning">${escapeHtml(m.meaning) || '<span style="color:#bbb;">(뜻 없음)</span>'}</div>
          ${m.usage ? `<div class="lr-usage">용례 · ${escapeHtml(m.usage)}</div>` : ''}
        </div>`).join('');
      body = `
        <div class="lr-head">
          <span class="lr-src coll">수집함</span>
          <button class="lr-close" onclick="closeLookup()">닫기 ✕</button>
        </div>${body}`;
    } else {
      body = `
        <div class="lr-head">
          <span class="lr-term">${escapeHtml(data.term)}</span>
          <div><span class="lr-src llm">AI</span> <button class="lr-close" onclick="closeLookup()" style="margin-left:6px;">닫기 ✕</button></div>
        </div>
        <div class="lr-meaning">${escapeHtml(data.meaning || '')}</div>`;
    }
    box.innerHTML = `<div class="lookup-result-box">${body}</div>`;
  } catch (err) {
    box.innerHTML = `<div class="lookup-result-box">검색 오류: ${escapeHtml(err.message)}</div>`;
  }
}
function closeLookup() {
  document.getElementById('lookup-result').innerHTML = '';
  const input = document.getElementById('lookupInput');
  if (input) input.value = '';
}

// ===== 유틸 =====
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// onclick 인라인 핸들러의 작은따옴표 문자열 안에 안전하게 넣기 위한 이스케이프
function escapeAttr(s) {
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\').replace(/'/g, "\\'")
    .replace(/"/g, '&quot;').replace(/\r?\n/g, ' ')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
