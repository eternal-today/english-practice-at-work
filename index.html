<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stealth AL</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 40px 20px;
    line-height: 1.6;
  }

  .container { max-width: 720px; margin: 0 auto; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    padding-bottom: 14px;
    border-bottom: 1px solid #e5e5e5;
  }
  .title { font-size: 13px; font-weight: 600; color: #666; letter-spacing: 1px; }
  .progress { font-size: 13px; color: #888; }

  .start-panel {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 32px;
  }
  .start-panel h2 { font-size: 16px; font-weight: 600; margin-bottom: 24px; color: #333; }
  .option-group { margin-bottom: 20px; }
  .option-label { font-size: 12px; color: #999; margin-bottom: 8px; display: block; }
  .option-row { display: flex; gap: 8px; }
  .opt-btn {
    padding: 8px 18px;
    background: #fff;
    border: 1px solid #d4d4d4;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .opt-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  select.opt-select {
    padding: 8px 12px;
    border: 1px solid #d4d4d4;
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }

  .mode-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #888;
    background: #f0f0f0;
    padding: 3px 10px;
    border-radius: 3px;
    margin-bottom: 12px;
  }
  .korean {
    font-size: 18px;
    font-weight: 500;
    padding: 22px;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    margin-bottom: 20px;
  }

  .typing-input {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    font-family: inherit;
    border: 1px solid #d4d4d4;
    border-radius: 6px;
    margin-bottom: 12px;
    outline: none;
  }
  .typing-input:focus { border-color: #1a1a1a; }

  .hint-line {
    font-size: 13px;
    color: #999;
    margin-bottom: 16px;
    min-height: 20px;
  }
  .hint-line .hint-chunk {
    display: inline-block;
    background: #f0f0f0;
    padding: 2px 8px;
    border-radius: 3px;
    margin-right: 6px;
    color: #555;
  }

  .assembled {
    min-height: 70px;
    padding: 14px;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-content: flex-start;
  }
  .assembled:empty::before { content: '여기에 청크가 조립됩니다'; color: #bbb; font-size: 13px; }

  .chunks-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    padding: 14px;
    background: #f5f5f5;
    border-radius: 6px;
  }
  .chunk {
    padding: 9px 14px;
    background: #fff;
    border: 1px solid #d4d4d4;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .chunk:hover { border-color: #555; }
  .chunk.selected { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .chunk.in-assembled { background: #f0f0f0; }
  .chunk-key { font-size: 11px; color: #999; margin-right: 6px; font-weight: 600; }
  .chunk.selected .chunk-key { color: #aaa; }

  .controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  button.action {
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  button.action:hover { background: #333; }
  button.action.secondary { background: #fff; color: #1a1a1a; border: 1px solid #d4d4d4; }
  button.action.secondary:hover { background: #f5f5f5; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 채점 결과 */
  .grade {
    border-radius: 6px;
    margin-bottom: 12px;
    overflow: hidden;
    border: 1px solid #e5e5e5;
  }
  .grade-head {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .grade.pass .grade-head { background: #f0f7f0; color: #2a5a2a; }
  .grade.partial .grade-head { background: #fdf6ec; color: #8a5a1a; }
  .grade.retry .grade-head { background: #faf0f0; color: #7a2a2a; }
  .verdict-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
    background: rgba(0,0,0,0.06);
  }
  .grade-body { padding: 14px 16px; background: #fff; }
  .grade-row { margin-bottom: 12px; }
  .grade-row:last-child { margin-bottom: 0; }
  .grade-row .label {
    font-size: 11px;
    color: #999;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 3px;
  }
  .grade-row .text { font-size: 15px; color: #1a1a1a; }
  .grade-row.minor .text { color: #8a5a1a; }
  .grade-row.native .text { color: #1a5a3a; font-weight: 500; }
  .grade-comment {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #f0f0f0;
    font-size: 13px;
    color: #777;
  }

  .feedback {
    padding: 14px 18px;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .feedback.correct { background: #f0f7f0; border: 1px solid #c8e0c8; color: #2a5a2a; }
  .feedback.incorrect { background: #faf0f0; border: 1px solid #e0c8c8; color: #7a2a2a; }
  .feedback .answer { margin-top: 6px; font-weight: 500; color: #1a1a1a; font-size: 15px; }

  .pattern-note {
    padding: 12px 18px;
    background: #f7f7f2;
    border: 1px solid #e0e0d0;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #55552a;
  }

  .summary-panel {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 32px;
    text-align: center;
  }
  .summary-panel h2 { font-size: 15px; font-weight: 600; color: #666; margin-bottom: 24px; }
  .big-number { font-size: 42px; font-weight: 700; margin-bottom: 6px; }
  .sub-metric { font-size: 13px; color: #888; margin-bottom: 28px; }

  .hint-bar { font-size: 12px; color: #999; text-align: center; margin-top: 16px; }
  .loading { text-align: center; padding: 40px; color: #888; }
  .spinner-text { color: #999; font-size: 13px; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">STEALTH AL</div>
      <div class="progress" id="progress"></div>
    </div>
    <div id="app"><div class="loading">불러오는 중...</div></div>
    <div class="hint-bar" id="hintbar"></div>
  </div>

<script>
// ===== 설정 =====
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwm3Htan4X_r_zVgyGgnuxKhp6OdOKJGwvpOfJLBM3t08R4x1H0o67z57FysVW7BiWN/exec'; // ← 본인 GAS 웹앱 URL
const KEY_MAP = '0123456789abcdef';

// ===== 상태 =====
let allSentences = [];
let session = [];
let sIdx = 0;
let mode = '';
let chunks = [];
let assembledOrder = [];
let hintCount = 0;
let attemptCount = 0;
let isAnswered = false;
let sessionResults = [];    // { counted: bool, first_pass: bool }
let selCount = 5;
let selTag = 'All';

// ===== 초기화 =====
async function init() {
  try {
    const res = await fetch(`${GAS_URL}?action=getSentences`);
    const data = await res.json();
    allSentences = data.sentences;
    renderStart();
    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'generateSentences', count: 5 }) })
      .catch(err => console.error('생성 실패:', err));
  } catch (err) {
    document.getElementById('app').innerHTML =
      `<div class="feedback incorrect">데이터를 불러오지 못했습니다: ${err.message}</div>`;
  }
}

// ===== 시작 화면 =====
function renderStart() {
  document.getElementById('progress').textContent = '';
  document.getElementById('hintbar').textContent = '';
  const tags = ['All', ...new Set(allSentences.flatMap(s => String(s.tags).split(',').map(t => t.trim())).filter(Boolean))];

  document.getElementById('app').innerHTML = `
    <div class="start-panel">
      <h2>오늘의 세션</h2>
      <div class="option-group">
        <span class="option-label">문제 수</span>
        <div class="option-row">
          <button class="opt-btn ${selCount===5?'active':''}" onclick="setCount(5)">5</button>
          <button class="opt-btn ${selCount===10?'active':''}" onclick="setCount(10)">10</button>
        </div>
      </div>
      <div class="option-group">
        <span class="option-label">태그</span>
        <select class="opt-select" id="tagSelect" onchange="selTag=this.value">
          ${tags.map(t => `<option value="${t}" ${t===selTag?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <button class="action" onclick="startSession()">세션 시작</button>
    </div>
  `;
}

function setCount(n) { selCount = n; renderStart(); }

// ===== 세션 구성 =====
function startSession() {
  let pool = allSentences.filter(s => s.chunks.length <= KEY_MAP.length);
  if (selTag !== 'All') pool = pool.filter(s => String(s.tags).includes(selTag));

  const wrong = pool.filter(s => s.stats.attempts > 0 && !s.stats.ever_correct);
  const unseen = shuffle(pool.filter(s => s.stats.attempts === 0));
  const seen = pool.filter(s => s.stats.attempts > 0 && s.stats.ever_correct)
    .sort((a, b) => String(a.stats.last_seen).localeCompare(String(b.stats.last_seen)));

  session = [...shuffle(wrong), ...unseen, ...seen].slice(0, selCount);

  if (session.length === 0) {
    document.getElementById('app').innerHTML =
      `<div class="feedback incorrect">해당 조건의 문장이 없습니다.</div>
       <button class="action secondary" onclick="renderStart()">돌아가기</button>`;
    return;
  }

  sIdx = 0;
  sessionResults = [];
  loadQuestion();
}

// ===== 문제 로드 =====
function loadQuestion() {
  if (sIdx >= session.length) { renderSummary(); return; }

  const s = session[sIdx];
  mode = s.stats.attempts === 0 ? 'scramble' : 'typing';

  attemptCount = 0;
  hintCount = getInitialHints(s);
  isAnswered = false;
  assembledOrder = [];

  if (mode === 'scramble') {
    chunks = shuffle([...s.chunks]).map((text, i) => ({ text, key: KEY_MAP[i], selected: false }));
  }

  document.getElementById('progress').textContent = `${sIdx + 1} / ${session.length}`;
  render();
}

// ===== 숙련도 기반 기본 힌트 개수 =====
function getInitialHints(s) {
  if (mode !== 'typing') return 0;
  const success = s.stats.first_try_success || 0;
  if (success === 0) return 2;
  if (success === 1) return 1;
  return 0;
}

// ===== 렌더링 =====
function render() {
  const s = session[sIdx];

  if (mode === 'typing') {
    document.getElementById('app').innerHTML = `
      <div class="mode-badge">TYPING · 자유 영작</div>
      <div class="korean">${s.korean_text}</div>
      <input type="text" class="typing-input" id="typingInput"
        placeholder="영어로 자유롭게 작문하세요" autocomplete="off" ${isAnswered ? 'disabled' : ''}>
      <div class="hint-line" id="hintLine"></div>
      <div class="controls">
        <button class="action" onclick="checkTyping()" id="submitBtn">채점 (Enter)</button>
        <button class="action secondary" onclick="revealHint()">힌트 (Tab)</button>
        <button class="action secondary" onclick="nextQuestion()">다음 (N)</button>
      </div>
      <div id="feedback-area"></div>
      <div id="pattern-area"></div>
    `;
    document.getElementById('hintbar').textContent = 'Tab: 청크 힌트 · Enter: 채점 · N: 다음';
    const input = document.getElementById('typingInput');
    input.focus();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); isAnswered ? nextQuestion() : checkTyping(); }
      if (e.key === 'Tab') { e.preventDefault(); revealHint(); }
    });
    renderHints();
  } else {
    const assembledHTML = assembledOrder.map(i => {
      const c = chunks[i];
      return `<button class="chunk in-assembled" onclick="toggleChunk(${i})"><span class="chunk-key">${c.key}</span>${c.text}</button>`;
    }).join('');
    const poolHTML = chunks.map((c, i) =>
      `<button class="chunk ${c.selected ? 'selected' : ''}" onclick="toggleChunk(${i})"><span class="chunk-key">${c.key}</span>${c.text}</button>`
    ).join('');

    document.getElementById('app').innerHTML = `
      <div class="mode-badge">FIRST LOOK · SCRAMBLE</div>
      <div class="korean">${s.korean_text}</div>
      <div class="assembled">${assembledHTML}</div>
      <div class="chunks-pool">${poolHTML}</div>
      <div class="controls">
        <button class="action" onclick="checkScramble()" ${assembledOrder.length === 0 ? 'disabled' : ''}>확인 (Enter)</button>
        <button class="action secondary" onclick="clearAssembled()">클리어 (Esc)</button>
        <button class="action secondary" onclick="nextQuestion()">다음 (N)</button>
      </div>
      <div id="feedback-area"></div>
      <div id="pattern-area"></div>
    `;
    document.getElementById('hintbar').textContent = '0~9, a~f: 청크 토글 · Esc: 클리어 · Enter: 확인 · N: 다음';
  }
}

// ===== 타이핑 힌트 =====
function renderHints() {
  const s = session[sIdx];
  const el = document.getElementById('hintLine');
  if (!el) return;

  const shown = s.chunks.slice(0, hintCount)
    .map(c => `<span class="hint-chunk">${c}</span>`).join('');
  const more = hintCount < s.chunks.length
    ? `<span style="color:#bbb; font-size:12px;">Tab: 힌트 더 보기 (${hintCount}/${s.chunks.length})</span>`
    : `<span style="color:#bbb; font-size:12px;">전체 힌트 표시됨</span>`;
  el.innerHTML = shown + (shown ? ' ' : '') + more;
}

function revealHint() {
  if (isAnswered) return;
  const s = session[sIdx];
  if (hintCount < s.chunks.length) { hintCount++; renderHints(); }
}

// ===== 타이핑 LLM 채점 =====
async function checkTyping() {
  if (isAnswered) return;
  const input = document.getElementById('typingInput');
  const userText = input.value.trim();
  if (!userText) return;

  attemptCount++;
  const s = session[sIdx];
  const allHintsOpen = hintCount >= s.chunks.length;

  // 채점 중 UI
  const fb = document.getElementById('feedback-area');
  document.getElementById('submitBtn').disabled = true;
  fb.innerHTML = `<div class="spinner-text">AI가 채점 중입니다...</div>`;

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'gradeTyping',
        korean_text: s.korean_text,
        reference_answer: s.english_text,
        user_input: userText
      })
    });
    const g = await res.json();
    const verdict = g.verdict || 'partial';
    const isPass = verdict === 'pass';

    // 로그: pass면 정답으로 기록
    logAttempt(s.id, isPass, attemptCount, userText);

    // 지표 집계: 첫 제출이고 힌트를 다 열지 않은 경우에만 카운트
    if (attemptCount === 1 && !allHintsOpen) {
      sessionResults.push({ counted: true, first_pass: isPass });
    } else if (attemptCount === 1 && allHintsOpen) {
      sessionResults.push({ counted: false, first_pass: false });
    }

    renderGrade(g, s);

    if (isPass) {
      isAnswered = true;
      document.getElementById('typingInput').disabled = true;
      fetchPatternNote(s.id);
    } else {
      // 재시도 가능: 버튼 복구, 입력 유지
      document.getElementById('submitBtn').disabled = false;
    }
  } catch (err) {
    fb.innerHTML = `<div class="feedback incorrect">채점 오류: ${err.message}</div>`;
    document.getElementById('submitBtn').disabled = false;
  }
}

// ===== 정규화 & diff =====
function normalizeForCompare(t) {
  return t.toLowerCase().replace(/[’]/g, "'").replace(/[.,!?"“”]/g, '').replace(/\s+/g, ' ').trim();
}

function renderMinorText(userInput, minor) {
  // 내 문장과 소극적 수정이 사실상 같은지 판단
  if (normalizeForCompare(userInput) === normalizeForCompare(minor)) {
    return { same: true, html: '' };
  }
  // 단어 단위로 바뀐 부분만 강조
  const uw = userInput.split(/\s+/);
  const mw = minor.split(/\s+/);
  const marked = mw.map((w, i) =>
    (normalizeForCompare(uw[i] || '') !== normalizeForCompare(w))
      ? `<span style="color:#c0392b; font-weight:600; text-decoration:underline;">${w}</span>`
      : w
  ).join(' ');
  return { same: false, html: marked };
}
 
function renderGrade(g, s) {
  const verdict = g.verdict || 'partial';
  const labelMap = { pass: '통과', partial: '부분 통과', retry: '다시 시도' };
  const fb = document.getElementById('feedback-area');

  const userInput = document.getElementById('typingInput').value.trim();
  const minorResult = g.minor ? renderMinorText(userInput, g.minor) : null;

  let minorRow = '';
  if (minorResult) {
    if (minorResult.same) {
      minorRow = `<div class="grade-row"><div class="label">소극적 수정 · 문법만</div>
        <div class="text" style="color:#2a5a2a;">문법 오류 없음 · 작성하신 문장을 그대로 쓰셔도 좋습니다</div></div>`;
    } else {
      minorRow = `<div class="grade-row minor"><div class="label">소극적 수정 · 문법만 (밑줄이 고친 부분)</div>
        <div class="text">${minorResult.html}</div></div>`;
    }
  }

  fb.innerHTML = `
    <div class="grade ${verdict}">
      <div class="grade-head">
        <span class="verdict-tag">${labelMap[verdict]}</span>
        ${verdict === 'retry' ? '의미를 다시 확인해보세요' : ''}
      </div>
      <div class="grade-body">
        ${minorRow}
        ${(verdict !== 'retry' && g.native) ? `<div class="grade-row native"><div class="label">적극적 수정 · 네이티브 AL</div><div class="text">${g.native}</div></div>` : ''}
        ${g.comment ? `<div class="grade-comment">${g.comment}</div>` : ''}
      </div>
    </div>
  `;
}

// ===== Scramble =====
function toggleChunk(idx) {
  if (isAnswered || mode !== 'scramble') return;
  const c = chunks[idx];
  if (c.selected) {
    c.selected = false;
    assembledOrder = assembledOrder.filter(i => i !== idx);
  } else {
    c.selected = true;
    assembledOrder.push(idx);
  }
  render();
}

function clearAssembled() {
  if (isAnswered) return;
  chunks.forEach(c => c.selected = false);
  assembledOrder = [];
  render();
}

function checkScramble() {
  if (assembledOrder.length === 0 || isAnswered) return;
  attemptCount++;
  const s = session[sIdx];
  const userText = assembledOrder.map(i => chunks[i].text).join(' ');
  const correctText = s.chunks.join(' ');
  const isCorrect = userText === correctText;
  logAttempt(s.id, isCorrect, attemptCount, userText);

  const fb = document.getElementById('feedback-area');
  if (isCorrect) {
    isAnswered = true;
    if (attemptCount === 1) sessionResults.push({ counted: true, first_pass: true });
    else if (sessionResults.length < sIdx + 1) sessionResults.push({ counted: true, first_pass: false });
    fb.innerHTML = `<div class="feedback correct">정답입니다 (${attemptCount}번째 시도)
      <div class="answer">${s.english_text}</div></div>`;
    fetchPatternNote(s.id);
  } else {
    fb.innerHTML = `<div class="feedback incorrect">다시 시도해보세요
      <div class="spinner-text" style="margin-top:8px;">AI 분석 중...</div></div>`;
    requestScrambleHint(s, userText);
  }
}

async function requestScrambleHint(s, userText) {
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'analyzeError',
        korean_text: s.korean_text,
        correct_answer: s.english_text,
        user_input: userText,
        attempt_number: attemptCount
      })
    });
    const data = await res.json();
    const fb = document.getElementById('feedback-area');
    if (fb && !isAnswered) {
      fb.innerHTML = `<div class="feedback incorrect">${data.hint || '다시 시도해보세요'}</div>`;
    }
  } catch (err) { console.error('힌트 오류:', err); }
}

// ===== 패턴 노트 =====
async function fetchPatternNote(sentenceId) {
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getPatternNote', sentence_id: sentenceId })
    });
    const data = await res.json();
    const el = document.getElementById('pattern-area');
    if (el && data.note) el.innerHTML = `<div class="pattern-note">패턴 · ${data.note}</div>`;
  } catch (err) { console.error('패턴 노트 오류:', err); }
}

// ===== 다음 =====
function nextQuestion() {
  if (!isAnswered && mode === 'typing' && sessionResults.length < sIdx + 1) {
    sessionResults.push({ counted: false, first_pass: false });
  } else if (!isAnswered && mode === 'scramble' && sessionResults.length < sIdx + 1) {
    sessionResults.push({ counted: false, first_pass: false });
  }
  sIdx++;
  loadQuestion();
}

// ===== 요약 =====
function renderSummary() {
  const counted = sessionResults.filter(r => r.counted);
  const passed = counted.filter(r => r.first_pass).length;
  const rate = counted.length > 0 ? Math.round(passed / counted.length * 100) : 0;

  let cumAttempted = 0, cumFirst = 0;
  allSentences.forEach(s => {
    if (s.stats.attempts > 0) { cumAttempted++; if (s.stats.first_try_success > 0) cumFirst++; }
  });
  const cumRate = cumAttempted > 0 ? Math.round(cumFirst / cumAttempted * 100) : 0;

  document.getElementById('progress').textContent = '';
  document.getElementById('hintbar').textContent = '';
  document.getElementById('app').innerHTML = `
    <div class="summary-panel">
      <h2>세션 완료</h2>
      <div class="big-number">${rate}%</div>
      <div class="sub-metric">이번 세션 첫시도 통과율 (${passed}/${counted.length}, 힌트 전체 사용 제외) · 누적 ${cumRate}%</div>
      <button class="action" onclick="location.reload()">새 세션 시작</button>
    </div>
  `;
}

// ===== 로그 =====
async function logAttempt(sentenceId, isCorrect, attemptNumber, userInput) {
  try {
    await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'logAttempt',
        sentence_id: sentenceId,
        is_correct: isCorrect,
        attempt_number: attemptNumber,
        user_input: userInput
      })
    });
  } catch (err) { console.error('로그 실패:', err); }
}

// ===== 키보드 (Scramble 전용) =====
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, select')) return;
  const key = e.key.toLowerCase();

  if (mode === 'scramble') {
    if (KEY_MAP.includes(key)) {
      const idx = KEY_MAP.indexOf(key);
      if (idx < chunks.length) { e.preventDefault(); toggleChunk(idx); }
      return;
    }
    if (e.key === 'Escape') { clearAssembled(); return; }
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (isAnswered) nextQuestion();
    else if (mode === 'scramble') checkScramble();
  } else if (key === 'n' && isAnswered) {
    nextQuestion();
  }
});

// ===== 유틸 =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

init();
</script>
